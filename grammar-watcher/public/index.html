<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Grammar Watcher</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #181b24;
    --border: #2a2e3a;
    --text: #e6e8ee;
    --muted: #8b90a0;
    --accent: #ff5d73;
    --accent-soft: #3a1e24;
    --chip: #253042;
    --chip-text: #9fd3ff;
    --ok: #4fd98a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 1.5rem 2rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  h1 {
    font-size: 1.15rem;
    margin: 0;
    font-weight: 600;
  }
  #status {
    font-size: 0.85rem;
    color: var(--muted);
  }
  #status.live::before {
    content: "●";
    color: var(--ok);
    margin-right: 0.4rem;
  }
  main {
    padding: 1.5rem 2rem 3rem;
    max-width: 820px;
    margin: 0 auto;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 4rem 1rem;
    font-size: 1.05rem;
  }
  .count {
    margin-bottom: 1rem;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .issue {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 1rem 1.2rem;
    margin-bottom: 0.85rem;
  }
  .issue .message {
    font-weight: 600;
    margin-bottom: 0.5rem;
  }
  .issue .context {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 0.88rem;
    color: var(--muted);
    background: #0b0d12;
    border-radius: 6px;
    padding: 0.55rem 0.7rem;
    margin-bottom: 0.6rem;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .issue .context mark {
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 3px;
    padding: 0 2px;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }
  .chip {
    background: var(--chip);
    color: var(--chip-text);
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-size: 0.82rem;
  }
  .error-banner {
    background: #3a1e1e;
    border: 1px solid #5a2e2e;
    color: #ff9f9f;
    padding: 0.8rem 1rem;
    border-radius: 8px;
    margin-bottom: 1rem;
  }
</style>
</head>
<body>
  <header>
    <h1>Grammar Watcher</h1>
    <span id="status">conectando…</span>
  </header>
  <main>
    <div id="results" class="empty">Esperando la primera comprobación…</div>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function renderContext(ctx) {
      const { text, offset, length } = ctx;
      const before = escapeHtml(text.slice(0, offset));
      const bad = escapeHtml(text.slice(offset, offset + length));
      const after = escapeHtml(text.slice(offset + length));
      return `${before}<mark>${bad}</mark>${after}`;
    }

    function render(payload) {
      if (!payload.ok) {
        resultsEl.className = "";
        resultsEl.innerHTML = `<div class="error-banner">${escapeHtml(payload.error)}</div>`;
        return;
      }

      const { matches, checkedAt } = payload;
      statusEl.textContent = `última comprobación: ${new Date(checkedAt).toLocaleTimeString()}`;

      if (!matches.length) {
        resultsEl.className = "empty";
        resultsEl.innerHTML = "✓ Sin problemas de gramática u ortografía.";
        return;
      }

      resultsEl.className = "";
      const count = `<div class="count">${matches.length} problema(s) encontrado(s)</div>`;
      const cards = matches.map((m) => {
        const chips = (m.replacements || [])
          .slice(0, 6)
          .map((r) => `<span class="chip">${escapeHtml(r.value)}</span>`)
          .join("");
        return `
          <div class="issue">
            <div class="message">${escapeHtml(m.message)}</div>
            <div class="context">${renderContext(m.context)}</div>
            ${chips ? `<div class="chips">${chips}</div>` : ""}
          </div>`;
      }).join("");

      resultsEl.innerHTML = count + cards;
    }

    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(`${proto}://${location.host}`);

      ws.onopen = () => {
        statusEl.classList.add("live");
        statusEl.textContent = "conectado, esperando guardado…";
      };
      ws.onmessage = (ev) => render(JSON.parse(ev.data));
      ws.onclose = () => {
        statusEl.classList.remove("live");
        statusEl.textContent = "desconectado, reintentando…";
        setTimeout(connect, 1500);
      };
      ws.onerror = () => ws.close();
    }

    connect();
  </script>
</body>
</html>
