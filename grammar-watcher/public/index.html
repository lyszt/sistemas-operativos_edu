<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Grammar Watcher</title>
<style>
  :root {
    --bg: #0d0f14;
    --panel: #1a1d26;
    --card: #1f232e;
    --border: #343a48;
    --text: #f5f6fa;
    --muted: #c3c8d6;
    --ok: #3ddc84;
    --err-bg: #4a1f1f;
    --err-border: #7a3030;
    --err-text: #ffb4b4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 17px;
  }
  header {
    padding: 1.5rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
    background: var(--panel);
  }
  h1 {
    font-size: 1.3rem;
    margin: 0;
    font-weight: 700;
  }
  #status {
    font-size: 0.9rem;
    color: var(--muted);
  }
  #status.live::before {
    content: "●";
    color: var(--ok);
    margin-right: 0.4rem;
  }
  main {
    padding: 1.5rem 2rem 3rem;
    max-width: 880px;
    margin: 0 auto;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 4rem 1rem;
    font-size: 1.15rem;
  }
  .summary {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    margin-bottom: 1.5rem;
  }
  .summary .total {
    font-size: 1.1rem;
    font-weight: 700;
    margin-right: 0.3rem;
    align-self: center;
  }
  .cat-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.35rem 0.75rem;
    border-radius: 999px;
    font-size: 0.88rem;
    font-weight: 700;
    color: #0c0d10;
  }
  .cat-badge .dot {
    width: 0.5rem;
    height: 0.5rem;
    border-radius: 50%;
    background: currentColor;
    filter: brightness(0.4);
  }
  .group {
    margin-bottom: 1.8rem;
  }
  .group-title {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.7rem;
    font-size: 1.05rem;
    font-weight: 700;
  }
  .group-title .swatch {
    width: 0.9rem;
    height: 0.9rem;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .issue {
    background: var(--card);
    border: 1px solid var(--border);
    border-left-width: 5px;
    border-left-style: solid;
    border-radius: 8px;
    padding: 1.1rem 1.3rem;
    margin-bottom: 0.85rem;
  }
  .issue .message {
    font-weight: 700;
    margin-bottom: 0.6rem;
    font-size: 1.02rem;
  }
  .issue .context {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 0.92rem;
    color: var(--muted);
    background: #0a0b0f;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.65rem 0.8rem;
    margin-bottom: 0.7rem;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.5;
  }
  .issue .context mark {
    background: #ffd84d;
    color: #231a00;
    border-radius: 3px;
    padding: 0.05rem 0.2rem;
    font-weight: 700;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.45rem;
  }
  .chips .label {
    color: var(--muted);
    font-size: 0.85rem;
    margin-right: 0.2rem;
  }
  .chip {
    background: #2d3346;
    color: #d7e6ff;
    padding: 0.28rem 0.7rem;
    border-radius: 999px;
    font-size: 0.88rem;
    font-weight: 600;
    border: 1px solid #40485f;
  }
  .error-banner {
    background: var(--err-bg);
    border: 1px solid var(--err-border);
    color: var(--err-text);
    padding: 0.9rem 1.1rem;
    border-radius: 8px;
    margin-bottom: 1rem;
    font-weight: 600;
  }
</style>
</head>
<body>
  <header>
    <h1>Grammar Watcher</h1>
    <span id="status">conectando…</span>
  </header>
  <main>
    <div id="results" class="empty">Esperando la primera comprobación…</div>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");

    // High-contrast, colorblind-distinguishable palette. Each category gets a
    // consistent color (by id) so badges, group headers and card borders all match.
    const CATEGORY_COLORS = {
      TYPOS: "#ffd166",          // amber
      GRAMMAR: "#b388ff",        // violet
      STYLE: "#4dd0e1",          // cyan
      TYPOGRAPHY: "#81c784",     // green
      PUNCTUATION: "#ff8a65",    // orange
      CASING: "#f06292",         // pink
      CONFUSED_WORDS: "#ba68c8", // purple
      REDUNDANCY: "#aed581",     // lime
      COLLOCATIONS: "#4fc3f7",   // light blue
      MISC: "#90a4ae",           // slate
    };
    const FALLBACK_COLORS = ["#e0e0e0", "#80cbc4", "#ffab91", "#9fa8da", "#c5e1a5"];

    function colorForCategory(id) {
      if (CATEGORY_COLORS[id]) return CATEGORY_COLORS[id];
      let hash = 0;
      for (const ch of id) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
      return FALLBACK_COLORS[hash % FALLBACK_COLORS.length];
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function renderContext(ctx) {
      const { text, offset, length } = ctx;
      const before = escapeHtml(text.slice(0, offset));
      const bad = escapeHtml(text.slice(offset, offset + length));
      const after = escapeHtml(text.slice(offset + length));
      return `${before}<mark>${bad}</mark>${after}`;
    }

    function groupByCategory(matches) {
      const groups = new Map();
      for (const m of matches) {
        const cat = m.rule?.category || { id: "MISC", name: "Otros" };
        if (!groups.has(cat.id)) groups.set(cat.id, { name: cat.name, items: [] });
        groups.get(cat.id).items.push(m);
      }
      return [...groups.entries()]
        .map(([id, g]) => ({ id, ...g }))
        .sort((a, b) => b.items.length - a.items.length);
    }

    function render(payload) {
      if (!payload.ok) {
        resultsEl.className = "";
        resultsEl.innerHTML = `<div class="error-banner">${escapeHtml(payload.error)}</div>`;
        return;
      }

      const { matches, checkedAt } = payload;
      statusEl.textContent = `última comprobación: ${new Date(checkedAt).toLocaleTimeString()}`;

      if (!matches.length) {
        resultsEl.className = "empty";
        resultsEl.innerHTML = "✓ Sin problemas de gramática u ortografía.";
        return;
      }

      resultsEl.className = "";
      const groups = groupByCategory(matches);

      const summary = `
        <div class="summary">
          <span class="total">${matches.length} problema(s)</span>
          ${groups.map((g) => {
            const color = colorForCategory(g.id);
            return `<span class="cat-badge" style="background:${color}"><span class="dot"></span>${escapeHtml(g.name)} · ${g.items.length}</span>`;
          }).join("")}
        </div>`;

      const sections = groups.map((g) => {
        const color = colorForCategory(g.id);
        const cards = g.items.map((m) => {
          const chips = (m.replacements || [])
            .slice(0, 6)
            .map((r) => `<span class="chip">${escapeHtml(r.value)}</span>`)
            .join("");
          return `
            <div class="issue" style="border-left-color:${color}">
              <div class="message">${escapeHtml(m.message)}</div>
              <div class="context">${renderContext(m.context)}</div>
              ${chips ? `<div class="chips"><span class="label">sugerencias:</span>${chips}</div>` : ""}
            </div>`;
        }).join("");

        return `
          <div class="group">
            <div class="group-title">
              <span class="swatch" style="background:${color}"></span>
              ${escapeHtml(g.name)} (${g.items.length})
            </div>
            ${cards}
          </div>`;
      }).join("");

      resultsEl.innerHTML = summary + sections;
    }

    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(`${proto}://${location.host}`);

      ws.onopen = () => {
        statusEl.classList.add("live");
        statusEl.textContent = "conectado, esperando guardado…";
      };
      ws.onmessage = (ev) => render(JSON.parse(ev.data));
      ws.onclose = () => {
        statusEl.classList.remove("live");
        statusEl.textContent = "desconectado, reintentando…";
        setTimeout(connect, 1500);
      };
      ws.onerror = () => ws.close();
    }

    connect();
  </script>
</body>
</html>
